<g font-family="Arial,sans-serif" font-size="16" fill="#111827"><text x="1115" y="440">• Amazon EC2</text><text x="1115" y="470">• Amazon RDS (MySQL)</text><text x="1115" y="500">• VPC &amp; Subnets</text><text x="1115" y="530">• Security Groups</text></g>
